name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  comprovacions:
    name: Tipus, tests i build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instal·la dependències
        run: npm ci

      - name: Comprovació de tipus
        run: npm run typecheck

      - name: Tests del motor i de la web
        run: npm test

      - name: Build de producció
        run: npm run build

      # El navegador només cal per a les proves d'extrem a extrem, que són les
      # que carreguen el build de debò i hi juguen una partida.
      - name: Instal·la Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Proves de navegador
        run: npm run test:e2e

      - name: Informe de les proves fallides
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-playwright
          path: apps/web/playwright-report/
          retention-days: 7
