name: Partida del dia (jugadors i classificació)

# La feina de servidor de la partida del dia (tools/jugadors-automatics, vegeu
# docs/JUGADORS-AUTOMATICS.md). Totes les execucions programades fan el mateix
# (`--auto`): tot el que falti segons l'hora de Barcelona i el que ja hi ha a
# Firestore (jugadors automàtics d'ahir pendents, classificació final d'ahir,
# jugadors d'avui als quals ha arribat l'hora, fotografia d'avui si en toca
# una). Les programades de GitHub poden arribar hores tard o no arribar: n'hi
# ha de reserva i, si sobren, no repeteixen res. Minuts lluny de l'inici de
# l'hora, que és quan GitHub en descarta més.
#
#   UTC    Barcelona (hivern / estiu)
#   07:17  8:17 / 9:17     jugadors (franja 8–12 h) · tanca ahir
#   08:17  9:17 / 10:17    jugadors · fotografia de les 9 h
#   09:17  10:17 / 11:17   jugadors
#   10:17  11:17 / 12:17   jugadors
#   11:37  12:37 / 13:37   jugadors que falten
#   14:17  15:17 / 16:17   fotografia de les 15 h
#   16:17  17:17 / 18:17   reserva
#   21:17  22:17 / 23:17   fotografia de les 22 h
#   21:47  22:47 / 23:47   reserva
on:
  schedule:
    - cron: '17 7 * * *'
    - cron: '17 8 * * *'
    - cron: '17 9 * * *'
    - cron: '17 10 * * *'
    - cron: '37 11 * * *'
    - cron: '17 14 * * *'
    - cron: '17 16 * * *'
    - cron: '17 21 * * *'
    - cron: '47 21 * * *'
  workflow_dispatch:
    inputs:
      accio:
        description: 'Què fer'
        type: choice
        options: [auto, jugadors, classificacio]
        default: auto
      prova:
        description: 'Prova: no escriu res, només diu què faria'
        type: boolean
        default: true
      ara:
        description: 'Els jugadors no esperen la seva hora'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: jugadors-automatics
  cancel-in-progress: false

jobs:
  publica:
    name: Jugadors i classificació
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/jugadors-automatics
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/jugadors-automatics/package-lock.json

      - name: Instal·la
        run: npm ci

      - name: Juga i publica
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SCHEDULE: ${{ github.event.schedule }}
          ACCIO: ${{ inputs.accio }}
          PROVA: ${{ inputs.prova }}
          ARA: ${{ inputs.ara }}
        run: |
          if [ -n "$SCHEDULE" ]; then
            ARGS="--auto"
          else
            case "$ACCIO" in
              jugadors) ARGS="--jugadors" ;;
              classificacio) ARGS="--classificacio" ;;
              *) ARGS="--auto" ;;
            esac
            if [ "$PROVA" = "true" ]; then ARGS="$ARGS --prova"; fi
            if [ "$ARA" = "true" ]; then ARGS="$ARGS --ara"; fi
          fi
          npx tsx publica.ts $ARGS
