name: Partida del dia (jugadors i classificació)

# La feina de servidor de la partida del dia (tools/jugadors-automatics, vegeu
# docs/JUGADORS-AUTOMATICS.md), 4 cops al dia a hores fixes en UTC (Barcelona:
# a l'hivern, la mateixa hora + 1; a l'estiu, + 2):
#
#   08:02 UTC  (9 h / 10 h)   jugadors automàtics + fotografia d'avui + final d'ahir
#   10:02 UTC  (11 h / 12 h)  jugadors automàtics que falten (l'última)
#   14:02 UTC  (15 h / 16 h)  fotografia d'avui
#   21:02 UTC  (22 h / 23 h)  fotografia d'avui
#
# Un sol horari en UTC: no cal executar-la dos cops pel canvi d'hora.
on:
  schedule:
    - cron: '2 8 * * *'
    - cron: '2 10 * * *'
    - cron: '2 14 * * *'
    - cron: '2 21 * * *'
  workflow_dispatch:
    inputs:
      accio:
        description: 'Què fer'
        type: choice
        options: [tot, jugadors, classificacio]
        default: tot
      prova:
        description: 'Prova: no escriu res, només diu què faria'
        type: boolean
        default: true
      ara:
        description: 'Els jugadors no esperen la seva hora'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: jugadors-automatics
  cancel-in-progress: false

jobs:
  publica:
    name: Jugadors i classificació
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/jugadors-automatics
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/jugadors-automatics/package-lock.json

      - name: Instal·la
        run: npm ci

      - name: Juga i publica
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SCHEDULE: ${{ github.event.schedule }}
          ACCIO: ${{ inputs.accio }}
          PROVA: ${{ inputs.prova }}
          ARA: ${{ inputs.ara }}
        run: |
          case "$SCHEDULE" in
            '2 8 * * *')  ARGS="--tanca-ahir --jugadors --classificacio" ;;
            '2 10 * * *') ARGS="--jugadors --ultima" ;;
            '2 14 * * *'|'2 21 * * *') ARGS="--classificacio" ;;
            *)
              case "$ACCIO" in
                jugadors) ARGS="--jugadors" ;;
                classificacio) ARGS="--classificacio" ;;
                *) ARGS="--jugadors --classificacio" ;;
              esac
              if [ "$PROVA" = "true" ]; then ARGS="$ARGS --prova"; fi
              if [ "$ARA" = "true" ]; then ARGS="$ARGS --ara"; fi
              ;;
          esac
          npx tsx publica.ts $ARGS
